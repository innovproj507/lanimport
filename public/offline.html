<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1b4d">
    <title>Sin conexion - LAN Import</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               box-sizing: border-box; background: #eef2f9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; }
        .tarjeta { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(11, 27, 77, .12); padding: 32px 28px; max-width: 380px; width: 100%; text-align: center; }
        img { height: 56px; margin-bottom: 16px; }
        h1 { font-size: 20px; color: #0b1b4d; margin: 0 0 8px; }
        p { font-size: 14px; color: #52525b; line-height: 1.5; margin: 0 0 20px; }
        button { background: #f59e0b; color: #000; border: 0; border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #fbbf24; }
    </style>
</head>
<body>
<div class="tarjeta">
    <img src="/assets/images/logo.svg" alt="LAN Import">
    <h1>Sin conexion a internet</h1>
    <p>El sistema necesita conexion para mostrar los datos al dia. Revise el Wi-Fi o los datos moviles e intente de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</div>
<script>
    // Al volver la conexion, recarga sola.
    window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
